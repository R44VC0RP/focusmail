<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Mail</title>
  <link rel="stylesheet" href="./theme/styles/fonts.css">
  <link rel="stylesheet" href="./theme/styles/tokens.css">
  <link rel="stylesheet" href="./theme/styles/components.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body data-trylle-theme="light">
  <script>
    (function () {
      var saved = localStorage.getItem("focus-mail-theme");
      var mode = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.body.setAttribute("data-trylle-theme", mode);
    })();
  </script>
  <svg hidden aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  </svg>

  <main class="app">
    <header class="toolbar">
      <label class="tl-input-group search" for="search">
        <svg class="tl-icon"><use href="#i-search"/></svg>
        <input id="search" class="tl-input" type="search" placeholder="Search mail" autocomplete="off" spellcheck="false" aria-label="Search mail">
        <kbd class="tl-kbd" id="search-hint">/</kbd>
      </label>
      <button class="tl-button" data-variant="ghost" data-icon-only id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="tl-icon"><use id="theme-icon" href="#i-moon"/></svg>
      </button>
    </header>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="meta">
          <nav class="views" id="views" aria-label="Mailboxes"></nav>
          <span id="filters"></span>
          <span id="count" aria-live="polite"></span>
        </div>
        <ol class="mail-list" id="list"></ol>
        <p class="tl-command-empty" id="empty" hidden></p>
      </div>

      <article class="reader" id="reader" tabindex="-1" aria-labelledby="reader-subject" hidden></article>
    </div>
  </main>

  <div class="tl-toast" id="toast" role="status" hidden>
    <svg class="tl-icon"><use href="#i-check"/></svg>
    <span></span>
  </div>

  <script src="./app.js"></script>
</body>
</html>
